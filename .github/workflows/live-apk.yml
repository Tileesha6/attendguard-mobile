name: Build AttendGuard live APK (Firebase)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-live:
    runs-on: ubuntu-latest
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Security scan before public build
        run: python3 scripts/check_public_repo.py

      - name: Check Firebase client configuration exists
        shell: bash
        run: |
          for name in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_SENDER_ID FIREBASE_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions repository secret: $name"
              exit 1
            fi
          done

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name attendguard build_project
          cp -R lib/. build_project/lib/
          cp -R test/. build_project/test/
          rm -f build_project/test/widget_test.dart

      - name: Install Flutter packages and Android BLE permissions
        working-directory: build_project
        run: |
          flutter pub add firebase_core firebase_auth cloud_firestore cloud_functions flutter_blue_plus permission_handler:12.0.3 device_info_plus flutter_secure_storage flutter_riverpod android_id crypto uuid
          python3 ../scripts/patch_android.py
          flutter pub get

      - name: Run BLE payload parser tests
        working-directory: build_project
        run: flutter test

      - name: Build installable APK (FIREBASE CONNECTED)
        working-directory: build_project
        shell: bash
        run: |
          flutter build apk --release -t lib/main.dart \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"

      - name: Upload live APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGuard-live-APK
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
