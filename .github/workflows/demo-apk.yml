name: Build AttendGuard ESP32 hardware test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-hardware-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Security scan before public build
        run: python3 scripts/check_public_repo.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name attendguard build_project
          cp -R lib/. build_project/lib/
          cp -R test/. build_project/test/
          rm -f build_project/test/widget_test.dart

      - name: Install BLE-only packages and Android permissions (no Firebase needed)
        working-directory: build_project
        run: |
          flutter pub add flutter_blue_plus permission_handler:12.0.3 device_info_plus
          python3 ../scripts/patch_android.py
          flutter pub get

      - name: Run BLE payload parser tests
        working-directory: build_project
        run: flutter test

      - name: Build real BLE scanner APK (NO SIMULATOR)
        working-directory: build_project
        run: flutter build apk --release -t lib/main_hardware_test.dart

      - name: Upload hardware-test APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGuard-ESP32-Hardware-Test-APK
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
